spring:
  application:
    name: smart-code-note
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cache:
    type: redis

server:
  port: 8080
  shutdown: graceful
  tomcat:
    connection-timeout: 30000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

smart-code-note:
  jwt:
    secret: ${JWT_SECRET:smart-code-note-default-secret-change-me}
    expire-minutes: 1440
  file:
    upload-dir: uploads
    max-size: 20MB
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      embedding-model: ${DEEPSEEK_EMBEDDING_MODEL:deepseek-chat}
      timeout-seconds: 180
  rag:
    enabled: true
    chunk-size: 500
    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.6
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
