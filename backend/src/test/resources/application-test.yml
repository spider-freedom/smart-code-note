spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:smart_code_note;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

smart-code-note:
  file:
    upload-dir: target/test-uploads
  ai:
    deepseek:
      api-key:
