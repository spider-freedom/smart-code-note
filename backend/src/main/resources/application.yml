spring:
  application:
    name: smart-code-note
  profiles:
    active: dev

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

smart-code-note:
  jwt:
    secret: ${JWT_SECRET:smart-code-note-default-secret-change-me}
    expire-minutes: 1440
  file:
    upload-dir: uploads
    max-size: 20MB
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:sk-521c5a46d9e34254b4eaa15b2ce92c34}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      timeout-seconds: 180
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
